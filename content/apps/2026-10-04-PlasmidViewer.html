<style>
:root {
  --bg: #eef1f5; --panel: #ffffff; --panel2: #f6f8fb; --border: #dbe1e8; --text: #1d2530; --muted: #6a7686;
  --accent: #2f6fed; --accent-weak: rgba(47,111,237,.12); --sel: rgba(47,111,237,.24); --enz: #1c55c7; --grid: rgba(20,40,70,.07);
  --map-bg: #fbfcfe; --shadow: 0 10px 40px rgba(15,25,45,.22); --danger: #d64545; --caret: #e5484d;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --panel: #1a1e25; --panel2: #20252d; --border: #2b323c; --text: #e4e8ee; --muted: #8e99a8;
    --accent: #5b8def; --accent-weak: rgba(91,141,239,.16); --sel: rgba(91,141,239,.34); --enz: #7fa6ff; --grid: rgba(255,255,255,.07);
    --map-bg: #161a20; --shadow: 0 10px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1a1e25; --panel2: #20252d; --border: #2b323c; --text: #e4e8ee; --muted: #8e99a8;
  --accent: #5b8def; --accent-weak: rgba(91,141,239,.16); --sel: rgba(91,141,239,.34); --enz: #7fa6ff; --grid: rgba(255,255,255,.07);
  --map-bg: #161a20; --shadow: 0 10px 40px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { height: 100%; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--mono); }

/* toolbar */
#toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.grp { display: flex; align-items: center; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--border); }
.grp:last-child, .grp.grow { border: 0; }
.grp.grow { flex: 1; padding: 0; }
.tb { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 52px; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--text); }
.tb b { font-size: 17px; line-height: 1.1; font-weight: 500; color: var(--accent); }
.tb span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--accent-weak); }
.tb.on { background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.sm { min-width: 30px; padding: 6px 8px; font-size: 13px; }
.sel-lbl { display: flex; flex-direction: column; font-size: 10.5px; color: var(--muted); padding: 0 6px; }
.sel-lbl select { margin-top: 1px; }
select, input[type=search], input[type=text], input:not([type]), input[type=number], textarea {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; outline: none;
}
select { padding: 4px 6px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
.findgrp input { width: 190px; }

.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); margin-right: auto; }
.btn.sm { padding: 4px 9px; }
.btn:disabled { opacity: .4; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.btnrow.center { justify-content: center; margin-top: 18px; }
.tx { border: 0; background: transparent; font-size: 16px; color: var(--muted); padding: 0 4px; border-radius: 4px; }
.tx:hover { color: var(--text); background: var(--accent-weak); }

/* tabs */
#tabs { display: flex; gap: 2px; padding: 6px 10px 0; background: var(--bg); min-height: 8px; overflow-x: auto; }
body.empty #tabs { display: none; }
.tab { display: flex; align-items: center; gap: 4px; padding: 5px 6px 5px 12px; border-radius: 8px 8px 0 0; background: var(--panel2); border: 1px solid var(--border); border-bottom: 0; color: var(--muted); cursor: pointer; max-width: 240px; }
.tab.on { background: var(--panel); color: var(--text); font-weight: 600; }
.tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* main layout */
#main { flex: 1; min-height: 0; display: flex; position: relative; background: var(--panel); border-top: 1px solid var(--border); }
#viewport { flex: 1; min-width: 0; display: flex; }
#mapPane, #seqPane { min-width: 0; min-height: 0; position: relative; }
#mapPane { flex: 1; background: var(--map-bg); border-right: 1px solid var(--border); display: flex; }
#mapHost { flex: 1; min-width: 0; min-height: 0; }
#mapPane.lin { overflow: auto; display: block; }
#mapPane.lin #mapHost { min-height: 100%; }
#seqPane { flex: 1; background: var(--panel); display: flex; flex-direction: column; }
#viewport.v-split #mapPane { flex: none; width: var(--mapw, 45%); }
#viewport.v-map #splitMS, #viewport.v-seq #splitMS { display: none; }
#viewport.v-map #seqPane { display: none; }
#viewport.v-seq #mapPane { display: none; }
#viewport.v-map #mapPane { border: 0; }
body.empty #viewport, body.empty #side, body.empty .splitter { display: none; }
body.noside #side, body.noside #splitSide { display: none; }
#welcome { display: none; flex: 1; align-items: center; justify-content: center; }
body.empty #welcome { display: flex; }
.wcard { text-align: center; max-width: 520px; padding: 20px; }
.wcard h1 { margin: 8px 0 6px; font-size: 28px; letter-spacing: -.5px; }
.wcard p { color: var(--muted); font-size: 14px; }
#side { width: var(--sidew, 320px); flex: none; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
#sideTabs { display: flex; border-bottom: 1px solid var(--border); }
#sideTabs button { flex: 1; padding: 9px 4px; border: 0; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; }
#sideTabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
#sideBody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.sidehead { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); }
.sidehead input { flex: 1; min-width: 0; }
.list { flex: 1; overflow: auto; padding: 4px; }
.list.tall { max-height: 280px; border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; flex: none; }
.item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.item:hover { background: var(--panel2); }
.item.on { background: var(--accent-weak); box-shadow: inset 0 0 0 1px var(--accent); }
.sw { width: 12px; height: 26px; border-radius: 4px; flex: none; }
.fn { min-width: 0; flex: 1; }
.fn b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--border); font-size: 11px; font-weight: 600; }
.badge.u { background: var(--accent); border-color: var(--accent); color: #fff; }
.empty-note { color: var(--muted); padding: 14px; text-align: center; font-size: 12px; }
.small-note { color: var(--muted); font-size: 12px; margin: 6px 0; }
.info { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.info h4, .libdlg h4 { margin: 12px 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.info label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.info label.chk, label.chk { flex-direction: row; align-items: center; gap: 7px; color: var(--text); }
.kv { display: flex; justify-content: space-between; padding: 2px 0; }
.kv span { color: var(--muted); }
.wrap { word-break: break-all; font-size: 12px; margin-top: 6px; }

/* status */
#status { display: flex; justify-content: space-between; gap: 12px; padding: 5px 12px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--border); }

/* SVG maps */
svg.map { display: block; width: 100%; height: 100%; font-family: var(--font); user-select: none; }
svg.map.lin { width: auto; height: auto; }
.mp-ring { stroke: var(--muted); opacity: .55; }
.mp-tick { stroke: var(--muted); stroke-width: 1; opacity: .75; }
.mp-ticklbl { fill: var(--muted); font-size: 11px; }
.mp-feat { stroke: rgba(0,0,0,.28); stroke-width: .8; cursor: pointer; }
.mp-feat:hover { filter: brightness(1.08); }
.mp-feat.on { stroke: var(--text); stroke-width: 2.2; }
.mp-feat.orf { opacity: .55; }
.mp-lbl { fill: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; }
.mp-lbl.enz { fill: var(--enz); font-weight: 600; font-size: 12px; }
.mp-lbl:hover { text-decoration: underline; }
.mp-flbl { font-size: 15px; font-weight: 600; pointer-events: none; }
.mp-hang { fill: none; stroke-width: 2; stroke-linejoin: round; cursor: pointer; }
.mp-hang.hov, .mp-hang.on { stroke: #e5322d; }
.mp-lead { fill: none; stroke: var(--muted); stroke-width: .8; opacity: .55; pointer-events: none; }
.mp-lead.on, .mp-lead.hov { stroke: #e5322d; stroke-width: 1.4; opacity: 1; }
.mp-cut { stroke: var(--enz); stroke-width: 1; opacity: .45; pointer-events: none; }
.mp-cut.hov, .mp-cut.on { stroke: #e5322d; stroke-width: 1.8; opacity: 1; }
.mp-sel { fill: var(--sel); }
.mp-caret { stroke: var(--caret); stroke-width: 1.5; }
.mp-title { fill: var(--text); font-size: 24px; font-weight: 700; }
.mp-title.lin { font-size: 14px; }
.mp-sub { fill: var(--muted); font-size: 17px; }
.mp-sub.small { font-size: 13px; font-weight: 400; }

/* sequence view */
#seqScroll { position: relative; flex: 1; min-height: 0; overflow: auto; outline: none; padding: 8px 12px 40px 8px; user-select: none; }
.seqfont, .ln, .fbar i { font-family: var(--mono); font-size: 14px; }
#seqRows .row { position: relative; }
.gut { position: absolute; left: 0; width: 78px; height: 19px; line-height: 19px; text-align: right; color: var(--muted); font: 11px/19px var(--mono); padding-right: 6px; }
.rseq { position: absolute; top: 0; bottom: 0; }
.ln { position: absolute; left: 0; height: 19px; line-height: 19px; white-space: pre; letter-spacing: 0; background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(10 * var(--cw) - 1px), var(--grid) calc(10 * var(--cw) - 1px), var(--grid) calc(10 * var(--cw))); }
.ln.bot { color: var(--muted); }
.selLayer { position: absolute; left: 0; right: 0; pointer-events: none; }
.selbox { position: absolute; top: 0; bottom: 0; background: var(--sel); border-radius: 2px; }
.caret { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--caret); animation: blink 1.1s steps(2, start) infinite; }
#seqScroll:not(:focus) .caret { animation: none; opacity: .8; }
@keyframes blink { to { visibility: hidden; } }
.fbar { position: absolute; height: 19px; border-radius: 3px; overflow: hidden; font-size: 11.5px; font-weight: 600; line-height: 19px; padding: 0 6px; white-space: nowrap; cursor: pointer; text-align: center; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); user-select: none; }
.fbar span { display: block; overflow: hidden; text-overflow: ellipsis; }
.fbar.arR { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); padding-right: 10px; }
.fbar.arL { clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); padding-left: 10px; }
.fbar.orf { opacity: .55; }
/* Golden Gate enzyme picker: aligned grid, one enzyme per cell, never wrapped */
.enzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 10px; max-height: 130px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.enzgrid label.chk { display: grid; grid-template-columns: 16px 56px 1fr; align-items: center; gap: 4px; margin: 0; white-space: nowrap; }
.enzgrid label.chk input { margin: 0; }
.enzgrid label.chk b { font-weight: 600; }
.enzgrid label.chk small { color: var(--muted); }
.fbrk { display: none; position: absolute; pointer-events: none; z-index: 3; }
.fbrk.bl::before, .fbrk.br::after { content: ''; position: absolute; top: 0; bottom: 0; width: 6px; border: 2px solid #e5322d; box-sizing: border-box; }
.fbrk.bl::before { left: 0; border-right: 0; }
.fbrk.br::after { right: 0; border-left: 0; }
.fbrk.hov { display: block; }
.fhang { position: absolute; overflow: visible; cursor: pointer; }
.fhang polyline { fill: none; stroke-width: 2; stroke-linejoin: round; }
.fhang.hov polyline { stroke: #e5322d; }
.fbar.on { box-shadow: inset 0 0 0 2px var(--text); }
.fbar i { position: absolute; top: 0; font-style: normal; font-size: 12px; font-weight: 700; text-align: center; line-height: 19px; }
.elbl { position: absolute; font-size: 11.5px; font-weight: 600; color: var(--enz); cursor: pointer; white-space: nowrap; line-height: 14px; }
.elbl:hover { text-decoration: underline; }
.estem { position: absolute; width: 1px; background: var(--enz); opacity: .8; }
.eshade { display: none; pointer-events: none; position: absolute; background: var(--enz); opacity: .17; border-radius: 3px; }
.ezig { display: none; position: absolute; overflow: visible; pointer-events: none; }
.ezig polyline { fill: none; stroke: #e5484d; stroke-width: 1.6; stroke-linejoin: miter; }

/* hover highlight + info pop-up */
.mp-feat.hov { stroke: #e5322d; stroke-width: 2.6; }
.mp-lbl tspan.hov { fill: #e5322d; }
.mp-lbl.hov, .mp-flbl.hov { fill: #e5322d; stroke: #e5322d; stroke-width: .6px; paint-order: stroke; }
.mp-flbl.hov { fill: #fff; stroke: #e5322d; stroke-width: 3px; paint-order: stroke; }
.fhang.hov polyline { stroke: #e5322d !important; }
.fbar.hov { box-shadow: inset 0 0 0 2px #e5322d; }
/* arrow-headed bars are clipped, so a box-shadow outline is cut off at the point: draw a closed outline with two stacked clipped layers instead (default grey, red on hover, dark when selected) */
.fbar.arR, .fbar.arL { box-shadow: none; --oc: rgba(0,0,0,.3); --ow: 1px; }
.fbar.arR.hov, .fbar.arL.hov, .fbar.arR.on, .fbar.arL.on { --ow: 2px; }
.fbar.arR.on, .fbar.arL.on { --oc: var(--text); }
.fbar.arR.hov, .fbar.arL.hov { --oc: #e5322d; }
.fbar.arR::before, .fbar.arL::before { content: ''; position: absolute; inset: 0; background: var(--oc); z-index: -2; }
.fbar.arR::after, .fbar.arL::after { content: ''; position: absolute; inset: var(--ow); background: inherit; z-index: -1; }
.fbar.arR::before { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); }
.fbar.arL::before { clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); }
.fbar.arR::after { clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 0 100%); }
.fbar.arL::after { clip-path: polygon(7px 0, 100% 0, 100% 100%, 7px 100%, 0 50%); }
#tip, #aaTip { display: none; position: fixed; z-index: 90; pointer-events: none; min-width: 190px; max-width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 12px; font-size: 12px; }
#tip .th, #aaTip .th { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
#tip .th i, #aaTip .th i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
#tip .tr, #aaTip .tr { display: flex; justify-content: space-between; gap: 14px; padding: 1px 0; }
#tip .tr span, #aaTip .tr span { color: var(--muted); }
#tip .tr b, #aaTip .tr b { font-weight: 600; text-align: right; }
#tip .tn, #aaTip .tn { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--border); color: var(--muted); }

/* modal, menus, toasts */
.backdrop { position: fixed; inset: 0; background: rgba(10,15,25,.45); display: flex; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(2px); }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); width: min(480px, 94vw); max-height: 90vh; display: flex; flex-direction: column; }
.modal.wide { width: min(640px, 94vw); }
.mhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 4px; }
.mhead h3 { margin: 0; font-size: 16px; }
.mbody { padding: 8px 18px 6px; overflow: auto; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; }
.form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea { color: var(--text); width: 100%; }
.field input[type=color] { padding: 2px; height: 32px; }
.field small { font-size: 11px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kbd { border-collapse: collapse; width: 100%; }
.kbd td { padding: 5px 4px; border-bottom: 1px solid var(--border); }
.kbd td:first-child { white-space: nowrap; width: 40%; }
code { font-family: var(--mono); background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 12px; }
.menu { position: fixed; z-index: 60; min-width: 230px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.mi { display: flex; align-items: center; width: 100%; padding: 6px 10px 6px 4px; border: 0; background: transparent; border-radius: 6px; text-align: left; }
.mi:hover:not(:disabled) { background: var(--accent); color: #fff; }
.mi:disabled { opacity: .4; cursor: default; }
.mi em { margin-left: auto; padding-left: 20px; font-style: normal; color: var(--muted); font-size: 11px; }
.mi:hover:not(:disabled) em { color: #fff; }
.ck { width: 20px; text-align: center; }
.sep { height: 1px; background: var(--border); margin: 4px 6px; }
#toasts { position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 80; pointer-events: none; }
.toast { background: #1f2630; color: #fff; padding: 8px 16px; border-radius: 99px; box-shadow: var(--shadow); font-size: 13px; transition: opacity .35s, transform .35s; }
.toast.out { opacity: 0; transform: translateY(8px); }
#dropHint { display: none; position: fixed; inset: 10px; border: 3px dashed var(--accent); border-radius: 18px; background: var(--accent-weak); z-index: 70; align-items: center; justify-content: center; font-size: 24px; color: var(--accent); font-weight: 700; pointer-events: none; }
body.dragging #dropHint { display: flex; }

@media (max-width: 900px) { .findgrp input { width: 110px; } }
@media print { #toolbar, #tabs, #side, #status { display: none; } }

/* enzyme pop-up */
#tip.enzTip { max-width: 360px; min-width: 300px; }
#tip .tr.hl, #aaTip .tr.hl { background: var(--accent-weak); border-radius: 6px; margin: 2px -6px 4px; padding: 3px 6px; }
#tip .tr.hl b, #aaTip .tr.hl b { color: var(--accent); }
#tip .sec, #aaTip .sec { margin: 8px 0 3px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
#tip .tag, #aaTip .tag { margin-left: auto; font-style: normal; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: #fff; }
#tip .th, #aaTip .th { margin-right: 0; }
#tip code, #aaTip code { font-size: 11px; }
#tip .acts, #aaTip .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 3px 0 5px; }
#tip .acts span, #aaTip .acts span { text-align: center; border-radius: 6px; padding: 2px 0 3px; font-weight: 700; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); }
#tip .acts i, #aaTip .acts i { display: block; font-style: normal; font-size: 9.5px; font-weight: 500; color: var(--muted); }
#tip .acts .hi, #aaTip .acts .hi { background: rgba(46,184,114,.2); border-color: rgba(46,184,114,.6); }
#tip .acts .mid, #aaTip .acts .mid { background: rgba(242,155,52,.2); border-color: rgba(242,155,52,.6); }
#tip .acts .lo, #aaTip .acts .lo { opacity: .65; }
.item.enz[data-enz]:hover { background: var(--accent-weak); }

#editBtn.on { background: rgba(229,72,77,.12); box-shadow: inset 0 0 0 1px #e5484d; }
#editBtn.on b, #editBtn.on span { color: #e5484d; }

.detbar label.chk input[type=number] { margin: 0 2px; }
.detlist { max-height: 340px; }
.item.det { cursor: pointer; }
.item.det.present { opacity: .6; cursor: default; }

.badge.present { background: var(--panel2); color: var(--muted); }

<script>
'use strict';
/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);

  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  if (value !== undefined) e.value = value;
  return e;
}

const store = {
  mem: {},   // in-memory fallback when localStorage is unavailable (private mode, sandboxed pages)
  get(k, d) {
    if (k in this.mem) return JSON.parse(this.mem[k]);
    try { const v = localStorage.getItem('pv.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
  },
  set(k, v) {
    const j = JSON.stringify(v); this.mem[k] = j;
    try { localStorage.setItem('pv.' + k, j); } catch (e) { /* ignore */ }
  },
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- sequence helpers ---------- */
const COMP = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A', R: 'Y', Y: 'R', K: 'M', M: 'K', S: 'S', W: 'W', B: 'V', V: 'B', D: 'H', H: 'D', N: 'N' };
/* complement of one base; keeps the case of the input (a → t, A → T); unknown letters become N/n */
function compChar(c) {
  const u = COMP[c]; if (u) return u;
  const l = COMP[c.toUpperCase()];
  return l ? l.toLowerCase() : (c === c.toLowerCase() ? 'n' : 'N');
}
function revcomp(s) { let o = ''; for (let i = s.length - 1; i >= 0; i--) o += compChar(s[i]); return o; }
function complement(s) { let o = ''; for (let i = 0; i < s.length; i++) o += compChar(s[i]); return o; }
const IUPAC = { A: 'A', C: 'C', G: 'G', T: 'T', U: 'T', R: 'AG', Y: 'CT', S: 'CG', W: 'AT', K: 'GT', M: 'AC', B: 'CGT', D: 'AGT', H: 'ACT', V: 'ACG', N: 'ACGTN' };
const iupacRegexSrc = site => site.split('').map(c => '[' + (IUPAC[c] || c) + ']').join('');
/* Keeps letters only (FASTA headers, digits, spaces dropped) and PRESERVES CASE; RNA U/u becomes T/t.
   Letters other than A/C/G/T are kept so they can be flagged and highlighted – see nonATGCStats(). */
function cleanSeq(text) {
  return String(text).replace(/^>.*$/gm, '').replace(/[^A-Za-z]/g, '').replace(/U/g, 'T').replace(/u/g, 't');
}
function nonATGCStats(s) {
  const m = String(s).match(/[^ACGTacgt]/g) || [], c = {};
  for (const ch of m) c[ch.toUpperCase()] = (c[ch.toUpperCase()] || 0) + 1;
  const detail = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `${k}×${v}`).join(', ');
  return { count: m.length, detail };

const CODON_AA = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const CIDX = { T: 0, C: 1, A: 2, G: 3 };
function codonToAA(c) {
  const a = CIDX[c[0].toUpperCase()], b = CIDX[c[1].toUpperCase()], d = CIDX[c[2].toUpperCase()];
  return (a === undefined || b === undefined || d === undefined) ? 'X' : CODON_AA[a * 16 + b * 4 + d];
}
function translate(s) { let o = ''; for (let i = 0; i + 2 < s.length; i += 3) o += codonToAA(s.substr(i, 3)); return o; }

function gcPercent(s) { if (!s.length) return 0; let g = 0; for (const c of s) if (c === 'G' || c === 'C' || c === 'g' || c === 'c') g++; return 100 * g / s.length; }
/* ---------- melting temperature: primer3 method ----------
   SantaLucia 1998 nearest-neighbour thermodynamics + SantaLucia salt correction, with primer3's conversion of Mg2+/dNTP into an
   equivalent monovalent concentration; oligos longer than 60 nt use primer3's long-sequence formula (as in oligotm.c / primer3-py). */
const NN_PARAMS = { AA: [-7.9, -22.2], TT: [-7.9, -22.2], AT: [-7.2, -20.4], TA: [-7.2, -21.3], CA: [-8.5, -22.7], TG: [-8.5, -22.7], GT: [-8.4, -22.4], AC: [-8.4, -22.4],
  CT: [-7.8, -21.0], AG: [-7.8, -21.0], GA: [-8.2, -22.2], TC: [-8.2, -22.2], CG: [-10.6, -27.2], GC: [-9.8, -24.4], GG: [-8.0, -19.9], CC: [-8.0, -19.9] };
const TM_DEFAULTS = { mv: 50, dv: 1.5, dntp: 0.6, dna: 50 };    // mM Na+/K+, mM Mg2+, mM dNTP, nM oligo (primer3 defaults)
const tmConf = () => Object.assign({ method: 'primer3' }, TM_DEFAULTS, store.get('tmConf', {}));
function tmPrimer3(seq, c = tmConf()) {
  const s = String(seq).toUpperCase(), n = s.length;
  if (n < 2 || /[^ACGT]/.test(s)) return NaN;
  let dv = c.dv, dntp = c.dntp; if (dv === 0) dntp = 0; if (dv < dntp) dv = dntp;
  const mv = c.mv + (dv > 0 ? 120 * Math.sqrt(dv - dntp) : 0);                     // equivalent monovalent salt, mM
  if (n > 60) { let gc = 0; for (const ch of s) if (ch === 'G' || ch === 'C') gc++; return 81.5 + 16.6 * Math.log10(mv / 1000) + 41 * gc / n - 600 / n; }
  let H = 0, S = 0;
  for (let i = 0; i < n - 1; i++) { const v = NN_PARAMS[s.substr(i, 2)]; H += v[0]; S += v[1]; }
  for (const ch of [s[0], s[n - 1]]) { if (ch === 'G' || ch === 'C') { H += 0.1; S -= 2.8; } else { H += 2.3; S += 4.1; } }
  const sym = s === revcomp(s); if (sym) S -= 1.4;
  S += 0.368 * (n - 1) * Math.log(mv / 1000);
  return H * 1000 / (S + 1.9872 * Math.log(c.dna * 1e-9 / (sym ? 1 : 4))) - 273.15;
}
/* NEB Tm Calculator, Q5 settings (reverse-engineered from tmcalculator.neb.com v1.17): SantaLucia 1998 nearest-neighbour thermodynamics at 1 M Na+ with
   500 nM primer (plain Ct, no Ct/4) and the Owczarzy 2004 monovalent salt correction for the 150 mM Q5 buffer; no length cut-off, no Mg2+ term. */
function tmQ5(seq) {
  const s = String(seq).toUpperCase(), n = s.length;
  if (n < 2 || /[^ACGT]/.test(s)) return NaN;
  let H = 0, S = 0, gc = 0;
  for (let i = 0; i < n - 1; i++) { const v = NN_PARAMS[s.substr(i, 2)]; H += v[0] * 1000; S += v[1]; }
  for (const ch of s) if (ch === 'G' || ch === 'C') gc++;
  for (const ch of [s[0], s[n - 1]]) { if (ch === 'G' || ch === 'C') { H += 100; S -= 2.8; } else { H += 2300; S += 4.1; } }
  if (s === revcomp(s)) S -= 1.4;
  const na = 0.150, ln = Math.log(na), fgc = gc / n;
  const t1M = H / (S + 1.9872 * Math.log(500e-9));
  return 1 / (1 / t1M + 1e-5 * (4.29 * fgc - 3.95) * ln + 9.4e-6 * ln * ln) - 273.15;
}
/* the Tm used throughout the app: primer3 (adjustable conditions) or NEB Q5 */
const tmPrimer = (seq, c = tmConf()) => c.method === 'q5' ? tmQ5(seq) : tmPrimer3(seq, c);
const meltingTemp = s => tmPrimer(s);
const fmtTm = t => (Number.isFinite(t) ? t.toFixed(1) + ' °C' : '—');
const tmConfText = (c = tmConf()) => c.method === 'q5' ? 'NEB Tm Calculator method for Q5 (SantaLucia 1998, 500 nM primer, 150 mM Na⁺ equivalent)' : `primer3 method · ${c.mv} mM Na⁺, ${c.dv} mM Mg²⁺, ${c.dntp} mM dNTP, ${c.dna} nM oligo`;

/* ---------- feature colours / types ---------- */
const TYPE_COLORS = {
  promoter: '#2eb872', CDS: '#f29b34', terminator: '#e0525f', rep_origin: '#8f96a3', primer_bind: '#6b7ae0',
  protein_bind: '#a66bd6', misc_feature: '#7f9fb5', enhancer: '#35b0c9', polyA_signal: '#d9534f', regulatory: '#2eb872',
  gene: '#f2c14e', mRNA: '#c9a227', sig_peptide: '#c97bd1', misc_recomb: '#e08fb5', LTR: '#6f8f3d', "5'UTR": '#8cc4a3',
  "3'UTR": '#8cc4a3', mat_peptide: '#e9a15a', misc_binding: '#a66bd6', ORF: '#b9a8d9',
};
const FEATURE_TYPES = ['CDS', 'promoter', 'terminator', 'rep_origin', 'enhancer', 'polyA_signal', 'primer_bind', 'protein_bind', 'regulatory',
  'misc_feature', 'gene', 'mRNA', 'sig_peptide', 'mat_peptide', 'misc_recomb', 'misc_binding', 'LTR', "5'UTR", "3'UTR"];
const typeColor = t => TYPE_COLORS[t] || '#7f9fb5';

function textOn(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#111';
  const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#14181f' : '#ffffff';
}

/* ---------- misc ---------- */
let _mctx;
function textWidth(text, font = '12px system-ui, sans-serif') {
  _mctx = _mctx || document.createElement('canvas').getContext('2d');
  _mctx.font = font; return _mctx.measureText(text).width;
}
function niceStep(n, target = 10) {
  const raw = n / target, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return Math.max(1, m * p);
  return 10 * p;
}

function toast(msg, ms = 2600, kind = '') {

/* Greedy lane assignment. items: [{id, ivs:[[a,b],...]}] (sorted internally). Returns {lane:Map, count} */
function assignLanes(items, gap = 0) {
  const sorted = items.slice().sort((x, y) => Math.min(...x.ivs.map(v => v[0])) - Math.min(...y.ivs.map(v => v[0])));
  const lanes = [], out = new Map();
  for (const it of sorted) {
    let k = 0;
    for (; k < lanes.length; k++) {
      if (!it.ivs.some(([a, b]) => lanes[k].some(([c, d]) => a < d + gap && c < b + gap))) break;
    }
    if (k === lanes.length) lanes.push([]);
    lanes[k].push(...it.ivs); out.set(it.id, k);
  }
  return { lane: out, count: lanes.length };
}

'use strict';
/* ---------- file formats: GenBank, FASTA, SnapGene .dna (read) ---------- */

function splitTop(s) {
  const out = []; let depth = 0, cur = '';
  for (const c of s) {
    if (c === '(') depth++; else if (c === ')') depth--;
    if (c === ',' && depth === 0) { out.push(cur); cur = ''; } else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}

function parseLocation(str) {
  str = str.replace(/\s+/g, '');
  const wrapped = /^complement\(/.test(str);
  function rec(s, st) {
    let m;
    if ((m = s.match(/^complement\((.*)\)$/))) return rec(m[1], -st);
    if ((m = s.match(/^(?:join|order)\((.*)\)$/))) { const out = []; for (const p of splitTop(m[1])) out.push(...rec(p, st)); return out; }
    const r = s.replace(/[<>]/g, '').replace(/^[^:]*:/, '');
    if ((m = r.match(/^(\d+)\.\.(\d+)$/))) return [{ s: +m[1] - 1, e: +m[2], st }];
    if ((m = r.match(/^(\d+)\^(\d+)$/))) return [{ s: +m[1] - 1, e: +m[1], st }];
    if ((m = r.match(/^(\d+)\.(\d+)$/))) return [{ s: +m[1] - 1, e: +m[2], st }];
    if ((m = r.match(/^(\d+)$/))) return [{ s: +m[1] - 1, e: +m[1], st }];
    return [];
  }
  let segs = rec(str, 1);
  if (!segs.length) return null;
  if (!wrapped && segs.length > 1 && segs.every(x => x.st === -1)) segs = segs.reverse();
  return { strand: segs[0].st, locs: segs.map(x => [x.s, x.e]) };
}

function parseGenBank(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  let i = 0;
  while (i < lines.length && !/^LOCUS/.test(lines[i])) i++;
  if (i >= lines.length) throw new Error('No LOCUS line found – not a GenBank file.');
  const doc = { name: 'Untitled', circular: false, seq: '', features: [], meta: {} };
  const lm = lines[i].match(/^LOCUS\s+(\S+)/);
  if (lm) doc.name = lm[1];
  doc.circular = /\bcircular\b/i.test(lines[i]);
  let section = '', cur = null, seq = [];

  const finish = () => {
    if (!cur) return;
    const q = {};
    for (const raw of cur.quals) {
      const m = raw.match(/^\/([^=\s]+)(?:=(.*))?$/s);
      if (!m) continue;
      let v = m[2] === undefined ? '' : m[2].trim();
      if (v.startsWith('"')) v = v.replace(/^"/, '').replace(/"$/, '').replace(/""/g, '"');
      (q[m[1]] = q[m[1]] || []).push(v);
    }
    cur = { ...cur, q }; cur.done = true;
    const loc = parseLocation(cur.loc);
    if (loc && cur.key !== 'source') {
      const first = k => (q[k] && q[k][0]) || '';
      const name = first('label') || first('ApEinfo_label') || first('gene') || first('product') || first('standard_name') || (first('note') || '').slice(0, 40) || cur.key;
      let color = first('ApEinfo_fwdcolor') || first('ApEinfo_revcolor') || first('color') || first('colour');
      const keep = {};
      for (const k of Object.keys(q)) if (!/^(label|ApEinfo_|translation|color|colour)/.test(k)) keep[k] = q[k];
      // SnapGene stores display info inside /note, e.g. /note="color: #ccffcc; direction: RIGHT" – pick the colour up and keep the rest of the note
      if (keep.note) {
        keep.note = keep.note.map(t => {
          t = t.replace(/\bcolou?r:\s*#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b;?\s*/gi, (_, h) => { if (!/^#[0-9a-f]{6}$/i.test(color)) color = '#' + (h.length === 3 ? h.replace(/./g, c => c + c) : h); return ''; });
          return t.replace(/\bdirection:\s*\w+;?\s*/gi, '').replace(/^[\s;]+|[\s;]+$/g, '');
        }).filter(Boolean);
        if (!keep.note.length) delete keep.note;
      }
      doc.features.push({ name, type: cur.key, strand: loc.strand, locs: loc.locs, color: /^#[0-9a-f]{6}$/i.test(color) ? color.toLowerCase() : '', quals: keep });
    }
    cur = null;
  };

  for (i++; i < lines.length; i++) {
    const L = lines[i];
    if (L.startsWith('//')) break;
    if (/^ORIGIN/.test(L)) { finish(); section = 'origin'; continue; }
    if (section === 'origin') { seq.push(L.replace(/[^A-Za-z]/g, '')); continue; }
    if (/^FEATURES/.test(L)) { section = 'features'; continue; }
    if (/^\S/.test(L)) {
      finish();
      section = L.split(/\s+/)[0];
      if (section === 'DEFINITION') doc.meta.definition = L.slice(12).trim();
      continue;
    }
    if (section !== 'features') continue;
    if (/^ {5}\S/.test(L)) {
      finish();
      cur = { key: L.slice(5, 21).trim(), loc: L.slice(21).trim(), quals: [], inQ: false };
    } else if (cur && /^ {21}/.test(L)) {
      const t = L.slice(21).trim();
      if (t.startsWith('/')) { cur.quals.push(t); cur.inQ = true; }
      else if (cur.inQ) cur.quals[cur.quals.length - 1] += (cur.quals[cur.quals.length - 1].startsWith('/translation') ? '' : ' ') + t;
      else cur.loc += t;
    }
  }
  finish();
  doc.seq = cleanSeq(seq.join(''));
  if (!doc.seq) throw new Error('GenBank file has no sequence.');
  return doc;
}

function parseFasta(text) {
  const m = text.match(/^\s*>(.*)$/m);
  const name = m ? (m[1].trim().split(/\s+/)[0] || 'Untitled') : 'Untitled';
  const body = text.split(/^\s*>/m).filter(Boolean);
  const seq = cleanSeq(m ? (body.length ? body[0].replace(/^.*\n?/, '') : '') : text);
  if (!seq) throw new Error('No sequence found.');
  return { name, circular: true, seq, features: [], meta: {} };
}

function parseSnapGene(buf, fallbackName) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let p = 0, seq = '', circular = false, xml = '';
  const dec = new TextDecoder('utf-8');
  while (p + 5 <= u8.length) {
    const type = u8[p], len = dv.getUint32(p + 1, false), off = p + 5;
    if (off + len > u8.length) break;
    if (type === 0) { circular = (u8[off] & 1) === 1; seq = dec.decode(u8.subarray(off + 1, off + len)); }
    else if (type === 10) xml = dec.decode(u8.subarray(off, off + len));
    p = off + len;
  }
  seq = cleanSeq(seq);
  if (!seq) throw new Error('Could not read the sequence of this SnapGene file.');
  const doc = { name: fallbackName, circular, seq, features: [], meta: {} };
  if (xml) {
    const x = new DOMParser().parseFromString(xml, 'text/xml');
    for (const f of $$('Feature', x)) {
      const type = f.getAttribute('type') || 'misc_feature';
      const dir = f.getAttribute('directionality');
      const locs = []; let color = '';
      for (const s of Array.from(f.children).filter(c => c.tagName === 'Segment')) {
        const m = (s.getAttribute('range') || '').match(/(\d+)-(\d+)/);
        if (m) { locs.push([+m[1] - 1, +m[2]]); color = color || s.getAttribute('color') || ''; }
      }
      if (!locs.length) continue;
      const quals = {};
      for (const q of Array.from(f.children).filter(c => c.tagName === 'Q')) {
        const v = q.querySelector('V'); const nm = q.getAttribute('name');
        if (nm && v) { const val = v.getAttribute('text') || v.getAttribute('int') || ''; if (val && nm !== 'label') (quals[nm] = quals[nm] || []).push(String(val).replace(/<[^>]+>/g, '')); }
      }
      doc.features.push({
        name: f.getAttribute('name') || type, type, strand: dir === '2' ? -1 : dir === '0' ? 0 : 1,
        locs, color: /^#[0-9a-f]{6}$/i.test(color) ? color : '', quals,
      });
    }
  }
  return doc;
}

function parseAny(buf, fileName) {
  const base = fileName.replace(/\.[^.]*$/, '') || 'Untitled';
  const u8 = new Uint8Array(buf);
  const magic = String.fromCharCode(...u8.subarray(5, 13));
  let doc;
  if (u8[0] === 9 && magic === 'SnapGene') doc = parseSnapGene(buf, base);
  else {
    const text = new TextDecoder('utf-8').decode(u8);
    if (/^LOCUS/m.test(text)) doc = parseGenBank(text);
    else doc = parseFasta(text);
    if (doc.name === 'Untitled' || !doc.name) doc.name = base;
  }
  doc.fileName = fileName;
  return doc;
}

/* ---------- writers ---------- */
function locString(f) {
  const parts = f.locs.map(([a, b]) => (b - a === 1 ? `${a + 1}` : `${a + 1}..${b}`));
  let s = parts.length > 1 ? `join(${parts.join(',')})` : parts[0];
  if (f.strand === -1) s = `complement(${s})`;
  return s;
}

function writeGenBank(doc) {
  const n = doc.seq.length;
  const d = new Date();
  const mon = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'][d.getMonth()];
  const date = `${String(d.getDate()).padStart(2, '0')}-${mon}-${d.getFullYear()}`;
  const lines = [];
  lines.push('LOCUS       ' + doc.name.replace(/\s+/g, '_').slice(0, 16).padEnd(16) + ' ' + String(n).padStart(11) + ' bp    DNA     ' + (doc.circular ? 'circular' : 'linear  ') + ' SYN ' + date);
  lines.push('DEFINITION  ' + (doc.meta.definition || '.'));
  lines.push('FEATURES             Location/Qualifiers');
  lines.push('     source          1..' + n);
  lines.push('                     /mol_type="other DNA"');
  const q = (k, v) => {
    const s = v === null ? `/${k}` : `/${k}="${String(v).replace(/"/g, "'").replace(/\s*\n\s*/g, ' ')}"`;
    for (let i = 0; i < s.length; i += 58) lines.push(' '.repeat(21) + s.slice(i, i + 58));
  };
  for (const f of doc.features) {
    const key = f.type || 'misc_feature';
    const loc = locString(f);
    lines.push('     ' + key.padEnd(16) + loc);
    q('label', f.name);
    for (const [k, vals] of Object.entries(f.quals || {})) for (const v of vals) q(k, v);
    const c = f.color || typeColor(f.type);
    q('ApEinfo_fwdcolor', c); q('ApEinfo_revcolor', c);
  }
  lines.push('ORIGIN');
  for (let i = 0; i < n; i += 60) {
    const chunk = doc.seq.slice(i, i + 60).match(/.{1,10}/g).join(' ');
    lines.push(String(i + 1).padStart(9) + ' ' + chunk);
  }
  lines.push('//');
  return lines.join('\n') + '\n';
}

function writeFasta(doc) {
  return '>' + doc.name.replace(/\s+/g, '_') + ' ' + doc.seq.length + ' bp ' + (doc.circular ? 'circular' : 'linear') + '\n' + (doc.seq.match(/.{1,70}/g) || []).join('\n') + '\n';
}

function compileEnzyme(name, def) {
  let top = null, bot = null, site = '';
  for (const c of def) {
    if (c === '^') top = site.length;
    else if (c === '_') bot = site.length;
    else site += c;
  }
  if (!/^[ACGTRYKMSWBDHVN]+$/.test(site)) return null;
  if (top === null) top = site.length; // e.g. "CCTC" w/o cut info → treat as cutting after site
  if (bot === null) bot = site.length - top;
  const rc = revcomp(site);
  const lead = site.match(/^N*/)[0].length, trail = site.match(/N*$/)[0].length;
  return { name, lead, trail, rcLead: rc.match(/^N*/)[0].length, rcTrail: rc.match(/N*$/)[0].length, def, site, top, bot, len: site.length, palin: rc === site, rcRegex: new RegExp('(?=(' + iupacRegexSrc(rc) + '))', 'g'), regex: new RegExp('(?=(' + iupacRegexSrc(site) + '))', 'g') };
}

/* Type IIS enzymes commonly used for Golden Gate / MoClo / GoldenBraid assembly */
const GOLDEN_GATE = new Set(['BsaI', 'BsmBI', 'Esp3I', 'BbsI', 'BpiI', 'SapI', 'BspQI', 'AarI', 'PaqCI', 'BtgZI', 'EarI', 'BsmAI', 'BspMI']);
let ENZYMES = [];
let enzVersion = 0;
function buildEnzymes() {
  const list = [];
  for (const line of ENZYME_DEFS.split('\n')) {
    const [n, d] = line.trim().split(/\s+/); if (!n || !d || d === 'skip') continue;
    const e = compileEnzyme(n, d); if (e) list.push(e);
  }
  const have = new Set(list.map(e => e.name));
  if (typeof nebExtraDefs === 'function') for (const [n, d] of nebExtraDefs()) { if (have.has(n)) continue; const e = compileEnzyme(n, d); if (e) { e.neb = true; list.push(e); have.add(n); } }
  for (const u of store.get('userEnzymes', [])) { if (have.has(u.name)) continue; const e = compileEnzyme(u.name, u.def); if (e) { e.user = true; list.push(e); } }
  list.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));
  ENZYMES = list; enzVersion++;
}

<script>
'use strict';
/* ---------- NEB enzyme information: parsing, extra enzymes, pop-up content ---------- */

const NEB = {};
for (const line of NEB_RAW.split('\n')) {
  const f = line.split('~'); if (f.length < 10) continue;
  const [name, site, buf, acts, heat, temp, dil, meth, sub, notes, flags] = f, a = acts.split('|');
  NEB[name] = {
    name, site, buf, act: { 'r1.1': a[0], 'r2.1': a[1], 'r3.1': a[2], 'rCutSmart': a[3] }, heat, temp, dil,
    meth: { Dam: meth[0], Dcm: meth[1], CpG: meth[2] }, sub, notes: notes ? notes.split(',').map(s => s.trim()) : [], flags: flags || '',
  };
}
const nebBase = n => n.replace(/-(HFv2|HF|v2)$/, '');

/* returns {main, variants} for an enzyme name (HF / v2 versions are listed as variants) */
function nebFor(name) {
  const variants = Object.keys(NEB).filter(k => k !== name && nebBase(k) === name).map(k => NEB[k]);
  let main = NEB[name];
  if (!main && variants.length) main = variants.shift();
  return main ? { main, variants } : null;
}

/* NEB notation ("G/GATCC", "GGTCTC(1/5)", "CCGC(-3/-1)") → our "G^GATCC" / "GGTCTCN^NNNN_" notation */
function nebToDef(seq) {
  let site, top, bot = null, m;
  if ((m = seq.match(/^([A-Z]+)\((-?\d+)\/(-?\d+)\)$/))) { site = m[1]; top = site.length + +m[2]; bot = site.length + +m[3]; }
  else if (/^[A-Z]*\/[A-Z]*$/.test(seq)) { top = seq.indexOf('/'); site = seq.replace('/', ''); }
  else return null;
  if (top < 0 || (bot !== null && bot < 0) || site.length > 30) return null;
  const len = Math.max(site.length, top, bot || 0), chars = site.padEnd(len, 'N');
  let out = '';
  for (let i = 0; i <= len; i++) { if (i === top) out += '^'; if (i === bot) out += '_'; if (i < len) out += chars[i]; }
  return out;
}
const NEB_SKIP = new Set(['MspJI', 'DpnI']);
/* NEB enzymes that are not yet in the built-in table (base names only) */
function nebExtraDefs() {
  const out = [];
  for (const k of Object.keys(NEB)) {
    const base = nebBase(k); if (NEB_SKIP.has(base) || /^(Nb|Nt|I-|PI-)/.test(base)) continue;
    const def = nebToDef(NEB[k].site) || nebToDef(NEB[base] ? NEB[base].site : '') || (NEB[k].site.match(/^[A-Z]+$/) && NEB[base] ? nebToDef(NEB[base].site) : null);
    if (def) out.push([base, def]);
  }
  return out;
}
buildEnzymes();

/* ---------- pop-up content ---------- */
const METH = { N: 'not sensitive', I: 'impaired', B: 'blocked', O: 'impaired if overlapping' };
const NOTE_TXT = {
  a: 'Ligation is <10 %', b: 'Ligation 25–75 %', c: 'Recutting after ligation <5 %', d: 'Recutting after ligation 50–75 %', e: 'Ligation/recutting not applicable (nicking, methylation-affected or cuts outside its site)',
  1: 'Star activity possible with extended digestion, high enzyme or >5 % glycerol', 2: 'Star activity possible with extended digestion', 3: 'Star activity possible with >5 % glycerol',
};
const bufName = b => (/^r\d/.test(b) ? 'NEBuffer ' + b : /^rCutSmart/.test(b) ? b.replace('rCutSmart', 'rCutSmart Buffer') : /Buffer/.test(b) ? b : 'NEBuffer ' + b);
function overhangInfo(e) {
  const d = e.bot - e.top;

function warnNonATGC(text, where) {

/* ----- case conversion (length-preserving, so features stay put) ----- */
function changeCase(doc, mode) {

/* ----- translations to the clipboard ----- */

function parseRanges(text, n) {
  const locs = [];
  for (const part of text.split(/[,;]+/).map(s => s.trim()).filter(Boolean)) {
    const m = part.match(/^(\d+)\s*(?:\.\.|-|–|:)\s*(\d+)$/) || part.match(/^(\d+)$/);
    if (!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a;
    if (a < 1 || b < a || b > n) return null;
    locs.push([a - 1, b]);
  }
  return locs.length ? locs : null;
}

/* ----- add a primer by sequence: the 3' part must match, a non-matching 5' tail is kept and drawn as a zigzag ----- */

    if (fw.length + rv.length) return { L, strand: fw.length ? 1 : -1, pos: fw.length ? fw[0] : rv[0], count: fw.length + rv.length };

function featureSequence(doc, f) {
  const cat = f.locs.map(([a, b]) => doc.seq.slice(a, b)).join('');

    const same = lib.find(l => l.seq && (l.seq === seq || l.seq === revcomp(seq)));

}

/* ----- Golden Gate between existing plasmids: digest every plasmid with the chosen enzyme(s) and ligate the compatible fragments ----- */
/* opts: docs (circular plasmids), enzymes (names) */
function designGGPlasmids(o) {
  const notes = [], warnings = [], docs = o.docs;
  const encs = (o.enzymes || []).map(n => ENZYMES.find(x => x.name === n)).filter(Boolean);
  if (!encs.length) throw new Error('Choose at least one Type IIS enzyme.');
  if (docs.length < 2) throw new Error('Choose at least two plasmids.');
  const encNames = encs.map(e => e.name).join(' + '), frags = [];
  docs.forEach((doc, di) => {
    if (!doc.circular) throw new Error(`“${doc.name}” is a linear sequence – only circular plasmids can be assembled this way.`);
    const U = doc.seq, n = U.length, cuts = [];
    for (const e of encs) { const r = analyzeEnzymes(doc).get(e.name); if (r) for (const c of r.cuts) cuts.push({ top: c.top, len: c.bot - c.top, enz: e }); }
    if (!cuts.length) throw new Error(`“${doc.name}” has no ${encNames} site.`);
    for (const c of cuts) if (c.len <= 0) c.len = (c.len + n) % n;
    cuts.sort((x, y) => x.top - y.top);
    const slice = (a, l) => { let t = ''; for (let i = 0; i < l; i++) t += U[(a + i) % n]; return t; };
    cuts.forEach((c, i) => {
      const nx = cuts[(i + 1) % cuts.length], len = ((nx.top - c.top + n) % n) || n, full = len + nx.len, text = slice(c.top, full);
      const U2 = text.toUpperCase();
      let sites = 0; for (const e of encs) sites += [...U2.matchAll(e.regex)].length + (e.palin ? 0 : [...U2.matchAll(e.rcRegex)].length);
      const tl = Math.min(full, n), ranges = c.top + tl <= n ? [{ a: c.top, b: c.top + tl, off: 0 }] : [{ a: c.top, b: n, off: 0 }, { a: 0, b: c.top + tl - n, off: n - c.top }];
      const feats = carryFeatures(doc, ranges).feats;
      frags.push({ doc, di, idx: frags.length, start: c.top, len, text, sites, feats, lov: U2.slice(0, c.len), rov: U2.slice(len), lLen: c.len, rLen: nx.len });
    });
  });
  const usable = frags.filter(f => !f.sites);
  if (usable.length < 2) throw new Error('Fewer than two fragments are free of recognition sites after digestion – nothing can be assembled (check that the sites point away from the fragments you want to keep).');
  const ends = (f, rc) => rc ? { l: revcomp(f.rov), r: revcomp(f.lov) } : { l: f.lov, r: f.rov };
  const cycles = [];
  const dfs = (path, used, start) => {
    if (cycles.length >= 200) return;
    const last = path[path.length - 1], r = ends(last.f, last.rc).r;
    if (path.length > 1 && r === ends(path[0].f, false).l) cycles.push(path.slice());
    if (path.length >= 12) return;
    for (const g of usable) {
      if (used.has(g.idx) || g.idx < start.idx) continue;
      for (const rc of [false, true]) { if (ends(g, rc).l !== r) continue; used.add(g.idx); path.push({ f: g, rc }); dfs(path, used, start); path.pop(); used.delete(g.idx); }
    }
  };
  for (const f of usable) {
    // a fragment that closes on itself (one cut site pair with identical ends) is a single-piece circle
    dfs([{ f, rc: false }], new Set([f.idx]), f);
  }
  const score = c => new Set(c.map(x => x.f.di)).size * 1000 + c.length;
  const good = cycles.filter(c => new Set(c.map(x => x.f.di)).size > 1);
  if (!good.length) throw new Error(`No circular assembly joins fragments from more than one plasmid: the ${encNames} overhangs of the plasmids do not match (or the product would still contain sites).`);
  good.sort((x, y) => score(y) - score(x));
  const top = good.filter(c => score(c) === score(good[0]));
  let cyc = good[0].slice();
  // start at the largest fragment, read in its own orientation
  let bi = 0; cyc.forEach((x, i) => { if (x.f.len > cyc[bi].f.len) bi = i; });
  if (cyc[bi].rc) cyc = cyc.reverse().map(x => ({ f: x.f, rc: !x.rc }));
  bi = 0; cyc.forEach((x, i) => { if (x.f.len > cyc[bi].f.len) bi = i; });
  cyc = cyc.slice(bi).concat(cyc.slice(0, bi));
  const parts = cyc.map(({ f, rc }) => {
    let clip = { text: f.text, features: f.feats.map(cloneFeat) };
    if (rc) clip = revcompClip(clip);
    const keep = clip.text.length - (rc ? f.lLen : f.rLen);
    return { text: clip.text.slice(0, keep), features: clip.features.filter(x => x.locs.every(([a, b]) => b <= keep)) };
  });
  const mid = joinParts(parts);
  const seq = mid.text;
  for (const x of cyc) notes.push(`${x.f.doc.name}: ${x.f.start + 1}→${((x.f.start + x.f.len - 1) % x.f.doc.seq.length) + 1} (${x.f.len.toLocaleString('en-US')} bp)${x.rc ? ', reverse-complemented' : ''}; overhangs ${ends(x.f, x.rc).l} … ${ends(x.f, x.rc).r}`);
  notes.unshift(`Assembly of ${new Set(cyc.map(x => x.f.di)).size} plasmids with ${encNames}. Fragments joined, in order:`);
  if (top.length > 1) warnings.push(`${top.length} different assemblies are possible with these plasmids and enzymes; the one starting with the largest fragment is shown. Use fewer plasmids or enzymes with distinct overhangs to make it unique.`);
  const used = new Set(cyc.map(x => x.f.idx)), leftover = frags.filter(f => f.sites).length;
  if (leftover) notes.push(`${leftover} fragment(s) still carrying recognition sites (e.g. the dropout or the excised vector parts) are re-cut and left out of the product.`);
  const lead = cyc[0].f.doc.name.replace(/_rc$/, ''), rest = [...new Set(cyc.map(x => x.f.doc.name).filter(nm => nm !== cyc[0].f.doc.name))];
  for (const e of encs) { const hits = [...seq.toUpperCase().matchAll(e.regex)].length + (e.palin ? 0 : [...seq.toUpperCase().matchAll(e.rcRegex)].length); if (hits) warnings.push(`The product still contains ${hits} ${e.name} site${hits > 1 ? 's' : ''}.`); }
  return { seq, circular: true, features: mid.features, primers: [], notes, warnings, method: 'Golden Gate (' + encNames + ', plasmids)', name: [lead, ...rest].join('_') };
}

/* ===================== Gateway (BP / LR) ===================== */
const ATT1_CORE = 'TTTGTACAAAAAAGC', ATT2_CORE = 'GCTTTCTTGTACAAA';        // crossover cores, att1 and att2 (as read with the gene)
const ATTB1_PRIMER = 'GGGGACAAGTTTGTACAAAAAAGCAGGCT', ATTB2_PRIMER = 'GGGGACCACTTTGTACAAGAAAGCTGGGT';

/* locate the two crossover cores in a plasmid; returns a doc in the orientation att1 … att2 plus the core start positions */
function findAtt(doc, label) {
  const U = seqU(doc), find = s => { const out = []; let i = U.indexOf(s); while (i !== -1) { out.push(i); i = U.indexOf(s, i + 1); } return out; };
  const f1 = find(ATT1_CORE), r1 = find(revcomp(ATT1_CORE)), f2 = find(ATT2_CORE), r2 = find(revcomp(ATT2_CORE));
  const n1 = f1.length + r1.length, n2 = f2.length + r2.length;
  if (n1 !== 1 || n2 !== 1) {
    // explain near-misses: the 15-nt crossover core must match exactly
    const near = (core, label) => {
      const hits = [...scanDNA(U, doc.circular, core, 3), ...scanDNA(U, doc.circular, revcomp(core), 3)].filter(([, m]) => m > 0);
      return hits.length ? ` Near-matches for the ${label} core: ${hits.slice(0, 3).map(([i, m]) => `${i + 1} (${m} mismatch${m > 1 ? 'es' : ''})`).join(', ')} – the recombination core must be exactly ${core}.` : '';
    };
    throw new Error(`“${doc.name}” must contain exactly one att1 and one att2 crossover core (found ${n1} and ${n2}).` + (n1 !== 1 ? near(ATT1_CORE, 'att1') : '') + (n2 !== 1 ? near(ATT2_CORE, 'att2') : ''));
  }
  if (f1.length && f2.length) return { doc, p1: f1[0], p2: f2[0] };
  if (r1.length && r2.length) { const d = rcDoc(doc), N = d.seq.length; return { doc: d, p1: N - r1[0] - 15, p2: N - r2[0] - 15 }; }
  throw new Error(`The att1 and att2 sites in “${doc.name}” point in opposite directions – not a valid Gateway vector.`);
}

/* text + features of the forward path a → b of a doc; the path may run across the origin of a circular plasmid */
function pathSegment(doc, a, b) {
  const U = doc.seq, n = U.length;
  if (a <= b) return { text: U.slice(a, b), features: clipFeatures(doc, a, b) };
  if (!doc.circular) throw new Error(`The att sites of “${doc.name}” are in the wrong order for a linear sequence.`);
  return { text: U.slice(a) + U.slice(0, b), features: carryFeatures(doc, [{ a, b: n, off: 0 }, { a: 0, b, off: n - a }]).feats };
}

/* BP: opts {donor, part, extraF, extraR, tm}.  LR: opts {entry, dest} */
function designGateway(o) {
  const notes = [], warnings = [], primers = [];
  let asm, name;
  if (o.reaction === 'BP') {
    const part = o.part, U = part.text.toUpperCase(), tm = o.tm;
    const tailF = ATTB1_PRIMER + o.extraF, tailR = ATTB2_PRIMER + o.extraR, gsF = pickGS(U, tm), gsR = pickGS(revcomp(U), tm);
    primers.push({ name: `${part.name}_attB1_F`, seq: tailF + gsF, tail: tailF.length, gs: gsF, strand: 1 }, { name: `${part.name}_attB2_R`, seq: tailR + gsR, tail: tailR.length, gs: gsR, strand: -1 });
    const product = tailF + part.text + revcomp(tailR), P = product.toUpperCase();
    const c1 = P.indexOf(ATT1_CORE), c2 = P.indexOf(ATT2_CORE);
    if (c1 < 0 || c2 < 0 || c2 < c1) throw new Error('Internal error: att cores not found in the PCR product.');
    const donor = findAtt(o.donor), D = donor.doc, shift = tailF.length - (c1 + 15);
    const mid = { text: product.slice(c1 + 15, c2), features: part.features.map(f => { const c = cloneFeat(f); c.locs = c.locs.map(([a, b]) => [a + shift, b + shift]); return c; }) };
    asm = backboneAssembly(D, donor.p2, donor.p1 + 15, mid);
    notes.push('BP reaction: the attB1/attB2 PCR product recombines with the attP sites of the donor vector; the region between the attP crossover cores (ccdB cassette) is replaced by your insert, giving an entry clone with attL1/attL2.');
    if (o.extraF.length % 3 !== 0 || o.extraR.length % 3 !== 0) notes.push('Check the reading frame: the attB1 primer’s extra bases should keep the insert in frame for downstream LR reactions.');
    name = `${D.name.replace(/_rc$/, '')}_${part.name}_entry`;

    name = `${D.name.replace(/_rc$/, '')}_${E.name.replace(/_rc$/, '').replace(/_entry$/, '')}`;

  const t = makeDoc({ name: 'tmp', seq: asm.seq, circular: true, features: JSON.parse(JSON.stringify(asm.features)) });
  const attLib = [{ name: 'attB1', type: 'misc_recomb', color: '#e08fb5', seq: 'ACAAGTTTGTACAAAAAAGCAGGCT' }, { name: 'attB2', type: 'misc_recomb', color: '#e08fb5', seq: 'ACCCAGCTTTCTTGTACAAAGTGGT' }];
  for (const h of detectCandidates(t, attLib, 1)) if (!h.present) asm.features.push(candidateToFeature(h));
  if (asm.dropped) warnings.push(`${asm.dropped} backbone feature(s) lay in the replaced region or spanned the recombination site and were not carried over (e.g. ccdB, attP/attR annotations).`);
  return { seq: asm.seq, circular: true, features: asm.features, primers, notes, warnings, method: 'Gateway ' + o.reaction, name };

      ctl.H = num(15, 8, 60); ctl.tm = num(60, 45, 72);
      panel.append(el('div', { class: 'two' }, field('Homology arm length (nt)', ctl.H, 'In-Fusion: 15 · Gibson / HiFi: 20–40'), field('Primer Tm target (°C)', ctl.tm)));
      const upd = () => { const sm = ctl.mode.value === 'sel'; ctl.enzBox.style.display = sm ? 'none' : 'block'; ctl.selInfo.style.display = sm ? 'block' : 'none'; const d = getDoc(ctl.vec), r = selRange(d); ctl.selInfo.textContent = r ? `Replaces ${r[0] + 1}..${r[1]} (${r[1] - r[0]} bp) of ${d.name}.` : `Inserts at the cursor (after base ${d.caret}) of ${d.name}.`; };
      ctl.mode.addEventListener('change', upd); ctl.vec.addEventListener('change', () => { fillEnz(); upd(); }); fillEnz(); upd();
    } else if (method === 'gg') {
      ctl.ggMode = sel([['pcr', 'PCR-amplified insert(s) (primers carry the enzyme site)'], ['plasmid', 'Digest & ligate existing plasmids (open tabs)']], 'pcr'); f('Insert source', ctl.ggMode);
      ctl.enzPick = el('div', { class: 'enzgrid' }); f('Type IIS enzyme(s) – tick several to use them together', ctl.enzPick, 'Eligible enzymes only (cut downstream of the site, 5′ overhang).');
      const pcr = el('div', {}), pl = el('div', {});
      ctl.vec = sel(docOpts, cur.id); pcr.append(field('Destination vector', ctl.vec));
      ctl.ggEnz = sel([['BsaI', 'BsaI']]); pcr.append(field('Enzyme whose site the primers carry', ctl.ggEnz, 'All ticked enzymes cut the vector (it needs exactly 2 sites in total); the PCR primers carry the site of this one.'));
      ctl.keep = sel([['auto', 'Automatic (keep the fragment without enzyme sites)'], ['A', 'Keep fragment A (between the sites, no origin crossing)'], ['B', 'Keep fragment B (spans the origin)']]); pcr.append(field('Backbone fragment', ctl.keep));
      ctl.pad = txt('TTTT', '', 120); ctl.tm = num(60, 45, 72); ctl.internal = txt('', 'auto', 260);
      pcr.append(el('div', { class: 'two' }, field('5′ pad (helps the enzyme cut)', ctl.pad), field('Primer Tm target (°C)', ctl.tm)), field('Internal overhangs (comma-separated, blank = automatic)', ctl.internal, 'Only needed with 2+ inserts: one overhang per junction between inserts.'));
      ctl.plSel = docs.map(d => ({ doc: d, cb: el('input', { type: 'checkbox', checked: (d === cur) || undefined, onchange: fillGG }) }));
      pl.append(el('div', { class: 'small-note' }, 'Tick the plasmids to assemble. Each is cut with the ticked enzyme(s); fragments without remaining sites are ligated through matching overhangs (either orientation).'),
        el('div', { class: 'enzpick' }, ctl.plSel.map(x => el('label', { class: 'chk', style: 'display:flex' }, x.cb, `${x.doc.name} (${x.doc.seq.length.toLocaleString('en-US')} bp${x.doc.circular ? '' : ', linear'})`))));
      panel.append(pcr, pl);
      const upd = () => { const isPl = ctl.ggMode.value === 'plasmid'; pcr.style.display = isPl ? 'none' : 'block'; pl.style.display = isPl ? 'block' : 'none'; partsWrap.style.display = isPl ? 'none' : 'block'; fillGG(); };
      ctl.ggMode.addEventListener('change', upd); ctl.vec.addEventListener('change', fillGG); upd();
    } else {
      ctl.rxn = sel([['BP', 'BP reaction – PCR product (attB) + donor vector (attP)'], ['LR', 'LR reaction – entry clone (attL) + destination vector (attR)']], 'BP'); f('Reaction', ctl.rxn);
      const bp = el('div', {}), lr = el('div', {});
      ctl.vec = sel(docOpts, cur.id); bp.append(field('Donor vector (attP1 … attP2)', ctl.vec));
      ctl.extraF = txt('', 'e.g. GCCACC (Kozak)', 160); ctl.extraR = txt('', "e.g. TTA (stop, written 5′→3′ in the primer)", 220); ctl.tm = num(60, 45, 72);
      bp.append(el('div', { class: 'two' }, field('Extra bases after attB1 (forward primer)', ctl.extraF), field('Extra bases after attB2 (reverse primer)', ctl.extraR)), field('Primer Tm target (°C)', ctl.tm));
      ctl.entry = sel(docOpts, cur.id); ctl.dest = sel(docOpts, (docs.find(d => d !== cur) || cur).id);
      lr.append(el('div', { class: 'two' }, field('Entry clone (attL1 … attL2)', ctl.entry), field('Destination vector (attR1 … attR2)', ctl.dest)), el('div', { class: 'small-note' }, 'No primers are needed for an LR reaction.'));
      panel.append(bp, lr);
      const upd = () => { const isBP = ctl.rxn.value === 'BP'; bp.style.display = isBP ? 'block' : 'none'; lr.style.display = isBP ? 'none' : 'block'; partsWrap.style.display = isBP ? 'block' : 'none'; };
      ctl.rxn.addEventListener('change', upd); setTimeout(upd, 0);
    }
    addBtn.style.display = method === 'gateway' ? 'none' : '';
  };

  const partsWrap = el('div', { class: 'partswrap' }, el('h4', {}, 'Insert(s)'), partsHost, addBtn);
  const tabs = el('div', { class: 'ctabs' });
  const setMethod = m => { method = m; $$('button', tabs).forEach(b => b.classList.toggle('on', b.dataset.m === m)); partsWrap.style.display = 'block'; if (m === 'gateway') while (rows.length > 1) { rows.pop().el.remove(); } buildPanel(); out.innerHTML = ''; design = null; };
  for (const [m, t] of [['homology', 'In-Fusion / Gibson'], ['gg', 'Golden Gate'], ['gateway', 'Gateway']]) tabs.append(el('button', { 'data-m': m, class: 'ctab', onclick: () => setMethod(m) }, t));

  /* ----- design + results ----- */
  const out = el('div', { class: 'cresult' });
  const run = () => {
    out.innerHTML = ''; design = null;
    try {
      const T = () => clamp(+ctl.tm.value || 60, 45, 72);
      if (method === 'gg' && ctl.ggMode.value === 'plasmid') {
        if (!ggChecked.size) throw new Error('Tick at least one enzyme.');
        design = designGGPlasmids({ docs: ctl.plSel.filter(x => x.cb.checked).map(x => x.doc), enzymes: [...ggChecked] });
      } else if (method === 'gateway' && ctl.rxn.value === 'LR') design = designGateway({ reaction: 'LR', entry: getDoc(ctl.entry), dest: getDoc(ctl.dest) });
      else {
        const parts = specs().map(s => resolvePart(s, docs)), vec = getDoc(ctl.vec);
        if (method === 'homology') {
          const H = clamp(+ctl.H.value || 15, 8, 60); let leftEnd, rightStart, addL = '', addR = '', siteNote = '';
          if (ctl.mode.value === 'sel') { if (vec.wrap) throw new Error('The selection in the vector runs across the origin – use “Set origin here” to move the origin first.'); const r = selRange(vec); [leftEnd, rightStart] = r || [vec.caret, vec.caret]; }
          else {
            if (!ctl.enz1.value) throw new Error('Choose at least one restriction enzyme for the vector (or use the selection mode).');
            const cutObj = v => { const [n, i] = v.split('|'); return { name: n, ...analyzeEnzymes(vec).get(n).cuts[+i] }; };
            const ca = cutObj(ctl.enz1.value), cb = ctl.enz2.value ? cutObj(ctl.enz2.value) : ca;
            if (ctl.enz2.value && ca.top === cb.top) throw new Error('The two enzymes cut at the same position.');
            const [cx, cy] = ca.top <= cb.top ? [ca, cb] : [cb, ca];
            const [cl, cr] = ctl.swap.checked ? [cy, cx] : [cx, cy];     // enzyme at the left / right junction of the insert
            leftEnd = cl.top; rightStart = cr.top;
            if (ctl.keepSites.checked) {
              const ok = c => c.s < c.top && c.top < c.e;                  // the cut must lie inside the recognition site
              if (!ok(cl) || !ok(cr)) throw new Error(`Restriction sites can only be regenerated for enzymes that cut inside their recognition site (not ${!ok(cl) ? cl.name : cr.name}).`);
              addL = vec.seq.slice(cl.top, cl.e); addR = vec.seq.slice(cr.s, cr.top);
              siteNote = `Restriction sites kept: ${cl.name} (${vec.seq.slice(cl.s, cl.e).toUpperCase()}) is regenerated at the left junction${cl === cr ? ' and again' : ', '} ${cr.name} (${vec.seq.slice(cr.s, cr.e).toUpperCase()}) at the right junction. The primers carry the missing half of each site after the vector homology, so the final plasmid can be cut with the same enzymes.`;
            }
          }
          design = designHomology({ vec, leftEnd, rightStart, parts, H, tm: T(), addL, addR, siteNote });
        } else if (method === 'gg') {
          if (!ggChecked.size) throw new Error('Tick at least one enzyme.');
          design = designGoldenGate({ vec, parts, enzyme: ctl.ggEnz.value, enzymes: [...ggChecked], tm: T(), pad: ctl.pad.value, keep: ctl.keep.value, internal: ctl.internal.value.split(/[,\s]+/).filter(Boolean) });
        } else {
          design = designGateway({ reaction: 'BP', donor: vec, part: parts[0], extraF: cleanSeq(ctl.extraF.value).toUpperCase(), extraR: cleanSeq(ctl.extraR.value).toUpperCase(), tm: T() });
        }
      }
      design.name = design.name || (getDoc(ctl.vec) ? getDoc(ctl.vec).name : 'cloned') + '_' + (rows.length ? rows.map(r => r.name.value.trim() || 'insert').join('_') : 'insert');
    } catch (e) { out.append(el('div', { class: 'warnline', style: 'display:block' }, '✖ ' + e.message)); return; }
    renderResult();
  };
  const renderResult = () => {
    const d = design; out.innerHTML = '';
    out.append(el('div', { class: 'okline' }, `✔ ${d.method}: new ${d.circular ? 'circular' : 'linear'} plasmid “${d.name}”, ${d.seq.length.toLocaleString('en-US')} bp, ${d.features.length} features.`));
    for (const w of d.warnings) out.append(el('div', { class: 'warnline', style: 'display:block' }, '⚠ ' + w));
    for (const n of d.notes) out.append(el('div', { class: 'small-note' }, n));
    if (d.primers.length) {
      const tbl = el('table', { class: 'ptable' }, el('tr', {}, ['Primer', "Sequence (5′→3′)", 'Length', 'Tm of binding part'].map(h => el('th', {}, h))));
      for (const p of d.primers) {
        const tail = p.seq.slice(0, p.seq.length - p.gs.length);
        tbl.append(el('tr', {}, el('td', {}, el('b', {}, p.name)), el('td', { class: 'mono pseq' }, tail ? el('span', { class: 'tail' }, tail) : '', p.gs), el('td', {}, p.seq.length + ' nt'), el('td', {}, fmtTm(tmPrimer(p.gs)))));
      }
      out.append(el('div', { class: 'ptablewrap' }, tbl), el('div', { class: 'small-note' }, 'Coloured part = 5′ extension (homology / enzyme site / att site); black = gene-specific binding part. Tm: ' + tmConfText() + '.'));
    }
    if (d.primers.length && tmConf().method === 'q5') {   // NEB rule for Q5: Ta = lower primer Tm + 1 °C (max 72 °C), calculated on the binding parts
      const byPart = new Map(); for (const p of d.primers) { const k = p.part ?? 0; (byPart.get(k) || byPart.set(k, []).get(k)).push(tmPrimer(p.gs)); }
      const ta = [...byPart.values()].filter(v => v.length === 2 && v.every(Number.isFinite)).map(v => Math.min(72, Math.min(...v) + 1).toFixed(1));
      if (ta.length) out.append(el('div', { class: 'small-note' }, `Suggested Q5 annealing temperature (lower Tm + 1 °C, max 72 °C): ${ta.map((t, i) => (ta.length > 1 ? `PCR ${i + 1}: ` : '') + t + ' °C').join(' · ')}.`));
    }
    const csv = () => 'Name,Sequence,Length,Tm\n' + d.primers.map(p => `${p.name},${p.seq},${p.seq.length},${fmtTm(tmPrimer(p.gs)).replace(' °C', '')}`).join('\n');
    out.append(el('div', { class: 'btnrow' },
      el('button', { class: 'btn primary', onclick: () => { const doc = addDoc({ name: d.name, seq: d.seq, circular: d.circular, features: d.features, meta: { definition: `Designed with Plasmid Viewer – ${d.method}` } }); doc.dirty = true; toast(`Created “${doc.name}”`); if (modal) modal.close(); } }, 'Create plasmid in a new tab'),
      d.primers.length ? el('button', { class: 'btn', onclick: async () => { await copyToSystem(d.primers.map(p => `${p.name}\t${p.seq}`).join('\n')); toast('Primers copied'); } }, 'Copy primers') : null,
      d.primers.length ? el('button', { class: 'btn', onclick: () => downloadBlob(d.name + '_primers.csv', csv(), 'text/csv') }, 'Download primers (CSV)') : null));
  };

  const tmSel = el('select', { onchange: () => { store.set('tmConf', { ...store.get('tmConf', {}), method: tmSel.value }); tmTxt.textContent = tmConfText(); requestUpdate(true); } }, el('option', { value: 'primer3' }, 'primer3'), el('option', { value: 'q5' }, 'NEB Q5'));
  tmSel.value = tmConf().method; const tmTxt = el('span', {}, tmConfText());
  const tmLine = el('div', { class: 'small-note' }, 'Primer Tm method: ', tmSel, ' ', tmTxt, '  ', el('a', { href: '#', onclick: e => { e.preventDefault(); openTmDialog(); } }, 'more settings'), ' (applies to the next design).');
  const body = el('div', { class: 'cloning' }, tabs, panel, tmLine, partsWrap, el('div', { class: 'btnrow' }, el('button', { class: 'btn primary', onclick: run }, 'Design')), out);
  addPart(); setMethod('homology');
  modal = openModal('Cloning tools', body, [{ label: 'Close' }], { wide: true });
}
actions.cloning = openCloningDialog;

</script>
